name: synthzilla

on:
  push:
    branches: [ main ]
    paths: [ "SynthZilla/**", ".github/workflows/synthzilla.yml" ]
  pull_request:
    paths: [ "SynthZilla/**", ".github/workflows/synthzilla.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel    # AU + VST3 + Standalone, universal binary (Intel + Apple Silicon); arm64 runners unavailable
    defaults:
      run:
        working-directory: SynthZilla
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/SynthZilla_artefacts/Release/AU/SynthZilla.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Szla Tmfu
      - name: Build installer (.pkg, Intel + Apple Silicon)
        run: ./packaging/macos/make_pkg.sh 2.0.1
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: SynthZilla-2.0.1-macOS-Installer
          path: SynthZilla/build/installer/SynthZilla-2.0.1-macOS.pkg
      - uses: actions/upload-artifact@v5
        with:
          name: SynthZilla-macOS
          path: |
            SynthZilla/build/SynthZilla_artefacts/Release/VST3
            SynthZilla/build/SynthZilla_artefacts/Release/AU
            SynthZilla/build/SynthZilla_artefacts/Release/Standalone
