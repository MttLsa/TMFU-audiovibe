name: 5ynth

on:
  push:
    branches: [ main ]
    paths: [ "SynthZilla/**", ".github/workflows/synthzilla.yml" ]
  pull_request:
    paths: [ "SynthZilla/**", ".github/workflows/synthzilla.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel    # AU + VST3 + Standalone, universal binary (Intel + Apple Silicon); arm64 runners unavailable
    defaults:
      run:
        working-directory: SynthZilla
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Fivesynth_artefacts/Release/AU/5ynth.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Szla Tmfu
      - name: Build installer (.pkg, Intel + Apple Silicon)
        run: ./packaging/macos/make_pkg.sh 2.1.0
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: 5ynth-2.1.0-macOS-Installer
          path: SynthZilla/build/installer/5ynth-2.1.0-macOS.pkg
      - uses: actions/upload-artifact@v5
        with:
          name: 5ynth-macOS
          path: |
            SynthZilla/build/Fivesynth_artefacts/Release/VST3
            SynthZilla/build/Fivesynth_artefacts/Release/AU
            SynthZilla/build/Fivesynth_artefacts/Release/Standalone
