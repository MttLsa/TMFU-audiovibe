name: AutoNormalizer

on:
  push:
    paths: [ "AutoNormalizer/**", ".github/workflows/autonormalizer.yml" ]
  pull_request:
    paths: [ "AutoNormalizer/**", ".github/workflows/autonormalizer.yml" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # AU + VST3 (universal: Intel + Apple Silicon)
            name: macOS
          - os: windows-2022    # VST3
            name: Windows
          - os: ubuntu-24.04    # VST3
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: AutoNormalizer
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      # VST2: store the legacy SDK somewhere you control and pass -DVST2_SDK_DIR=... here.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate AU (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/AutoNormalizer_artefacts/Release/AU/AutoNormalizer.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf AtNz Atnm
      - name: pluginval (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
            unzip -q pv.zip && PV=pluginval.app/Contents/MacOS/pluginval
            $PV --strictness-level 8 --validate-in-process build/AutoNormalizer_artefacts/Release/VST3/AutoNormalizer.vst3
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
            unzip -q pv.zip
            xvfb-run -a ./pluginval --strictness-level 8 --validate-in-process build/AutoNormalizer_artefacts/Release/VST3/AutoNormalizer.vst3
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: AutoNormalizer-${{ matrix.name }}
          path: |
            AutoNormalizer/build/AutoNormalizer_artefacts/Release/VST3
            AutoNormalizer/build/AutoNormalizer_artefacts/Release/AU
            AutoNormalizer/build/AutoNormalizer_artefacts/Release/VST
