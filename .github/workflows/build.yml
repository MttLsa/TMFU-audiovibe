name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # builds AU + VST3 (universal arm64/x86_64)
            name: macOS
          - os: windows-2022    # builds VST3
            name: Windows
          - os: ubuntu-24.04    # builds VST3
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfontconfig1-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate AU (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Twinbox_artefacts/Release/AU/Twinbox.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Twbx Twnb
      - uses: actions/upload-artifact@v4
        with:
          name: Twinbox-${{ matrix.name }}
          path: |
            build/Twinbox_artefacts/Release/VST3
            build/Twinbox_artefacts/Release/AU
