name: build

on:
  push:
    branches: [ main ]
    paths-ignore: [ "docs/**", "README.md" ]   # documentation changes do not trigger a build
  workflow_dispatch:                            # manual start from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # builds AU + VST3 + .pkg installer (universal: Intel x86_64 + Apple Silicon)
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfontconfig1-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate AU (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Twinbox_artefacts/Release/AU/Twinbox.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Twbx Twnb
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/macos/make_pkg.sh 2.3.0
      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: Twinbox-macOS-Installer
          path: build/installer/Twinbox-2.3.0-macOS.pkg
      - uses: actions/upload-artifact@v5
        with:
          name: Twinbox-${{ matrix.name }}
          path: |
            build/Twinbox_artefacts/Release/VST3
            build/Twinbox_artefacts/Release/AU
