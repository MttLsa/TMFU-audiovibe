name: globalcontrol

on:
  push:
    branches: [ main ]
    paths: [ "GLOBAL_CONTROL/**", ".github/workflows/globalcontrol.yml" ]
  pull_request:
    paths: [ "GLOBAL_CONTROL/**", ".github/workflows/globalcontrol.yml" ]
  workflow_dispatch:

jobs:
  tests:
    # Core (C++) + bridge (gc_bridge.js on a simulated Live Object Model) + OSC end-to-end over UDP.
    # The real tests in Ableton Live run on a Mac by hand: GLOBAL_CONTROL/Documentation/TEST_PLAN.md
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GLOBAL_CONTROL
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: OSC end-to-end (mock LOM)
        run: |
          node Tests/OSCtests/mock_bridge_server.js &
          sleep 1
          python3 Tests/AbletonIntegrationTests/gc_poc.py phase-test --device "Pro-C 2" --param Threshold --expect 10 --absolute -12 --delta -2
          kill %1
